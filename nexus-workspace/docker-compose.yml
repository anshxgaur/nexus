

networks:
  nexus-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  livekit_data:

services:
  # ─── Database ───────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexuspass
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nexus-net
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - nexus-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Qdrant ─────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - nexus-net
    ports:
      - "6333:6333"
      - "6334:6334"

  # ─── Ollama ─────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - nexus-net
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h

  # ─── Ollama Model Puller ─────────────────────────────────────
  ollama-puller:
    image: ollama/ollama:latest
    networks:
      - nexus-net
    depends_on:
      ollama:
        condition: service_started
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: >
      sh -c "
        sleep 10 &&
        OLLAMA_HOST=http://ollama:11434 ollama pull mistral:7b-instruct &&
        echo 'Model pulled successfully'
      "
    restart: on-failure

  # ─── LiveKit ────────────────────────────────────────────────
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit/livekit.yaml
    networks:
      - nexus-net
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # ─── Whisper Service ────────────────────────────────────────
  whisper:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - nexus-net
    ports:
      - "8001:8001"
    environment:
      - BACKEND_URL=http://backend:8000
      - WHISPER_MODEL=base.en
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 4G

  # ─── Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - nexus-net
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://nexus:nexuspass@postgres:5432/nexus
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - OLLAMA_URL=http://ollama:11434
      - SECRET_KEY=super-secret-key-change-in-production-please
      - LIVEKIT_URL=http://livekit:7880
      - LIVEKIT_API_KEY=devkey
      - LIVEKIT_API_SECRET=secret
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  # ─── Nginx ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - nexus-net
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
